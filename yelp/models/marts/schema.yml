version: 2

models:
  - name: dim_business
    columns:
      - name: business_key
        tests: [unique, not_null]
  - name: dim_user
    columns:
      - name: user_key
        tests: [unique, not_null]
  - name: dim_category
    columns:
      - name: category_key
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: fact_review
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: user_key
        tests:
          - relationships: {to: ref('dim_user'), field: user_key}
      - name: business_key
        tests:
          - relationships: {to: ref('dim_business'), field: business_key}
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_tip
    columns:
      - name: tip_id
        tests: [unique, not_null]
      - name: user_key
        tests:
          - relationships: {to: ref('dim_user'), field: user_key}
  - name: bridge_business_category
    columns:
      - name: category_key
        tests:
          - relationships: {to: ref('dim_category'), field: category_key}
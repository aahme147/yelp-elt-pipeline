version: 2

models:
  - name: dim_business
    columns:
      - name: business_key
        tests: [unique, not_null]
  - name: dim_user
    columns:
      - name: user_key
        tests: [unique, not_null]
  - name: dim_category
    columns:
      - name: category_key
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: fact_review
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: user_key
        tests:
          - relationships: {to: ref('dim_user'), field: user_key}
      - name: business_key
        tests:
          - relationships: {to: ref('dim_business'), field: business_key}
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_tip
    columns:
      - name: tip_id
        tests: [unique, not_null]
      - name: user_key
        tests:
          - relationships: {to: ref('dim_user'), field: user_key}
  - name: bridge_business_category
    columns:
      - name: category_key
        tests:
          - relationships: {to: ref('dim_category'), field: category_key}

  - name: mart_business_performance
    description: "One row per business with review, check-in and tip metrics. Each fact is aggregated before joining to avoid fan-out."
    columns:
      - name: business_key
        description: "Surrogate key of the business."
        tests: [unique, not_null]
      - name: review_count
        description: "Total reviews for the business."

  - name: mart_monthly_review_trends
    description: "One row per calendar year and month: review volume, average stars and active businesses."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['year', 'month']

  - name: mart_category_performance
    description: "One row per category. A review counts once per category its business belongs to, so category totals must not be added together."
    columns:
      - name: category
        description: "Category name."
        tests: [unique, not_null]

  - name: mart_user_activity
    description: "One row per user: reviews written, average stars given, tips written and compliments received."
    columns:
      - name: user_key
        description: "Surrogate key of the user."
        tests: [unique, not_null]